[package]
name = "166gkhdbn-boop/aidify-panel"
version = "0.2.0"
description = "Proxy user management panel on Wasmer Edge (WinterJS)"
license = "MIT"

[dependencies]
"wasmer/winterjs" = "*"

[fs]
"/app" = "./app"

[[command]]
name = "script"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["serve", "/app/app.js", "--script"]
